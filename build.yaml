# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
# Board target: nRFMicro 1.3 (nRF52840). ZMK on Zephyr 4.1 / hardware model v2
# renamed the old `nrfmicro_13` board to `nrfmicro@1.3.0/nrf52840/zmk`.
---
include:
#  - board: nice_nano_v2
#    shield: corne_left
#  - board: nice_nano_v2
#    shield: corne_right
  - board: nrfmicro@1.3.0/nrf52840/zmk
    shield: corne_left
  - board: nrfmicro@1.3.0/nrf52840/zmk
    shield: corne_right
  - board: nrfmicro@1.3.0/nrf52840/zmk
    shield: settings_reset
